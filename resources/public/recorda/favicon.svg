<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- recorda, drawn for the size a tab actually shows it at.

       A plain record dot stood here, which is what every recorder's icon is.
       The lanes and the playhead are what this one looks like — but three thin
       bars turn to mush at sixteen pixels, so it is two thick ones and a fat
       red playhead, and the whole thing survives being halved twice. -->
  <rect width="32" height="32" rx="7" fill="#1b1e28"/>
  <g fill="#a5b4fc">
    <rect x="4" y="8"  width="24" height="7" rx="2.5"/>
    <rect x="4" y="18" width="17" height="7" rx="2.5" opacity="0.72"/>
  </g>
  <!-- The playhead, and the only red on it: the one thing that moves. -->
  <rect x="10" y="4" width="3.4" height="25" rx="1.7" fill="#dc2626"/>
  <circle cx="11.7" cy="5.2" r="3.4" fill="#dc2626"/>
</svg>
